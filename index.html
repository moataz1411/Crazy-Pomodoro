<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crazy Pomodoro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">Crazy Pomodoro</h1>
        <hr>
    <div class="mode">
        <button id ="classic">Classic Mode</button>
        <button id="focus">Focus Mode</button>
        <button id="productive">Productive Mode</button>
</div>
        <p class="timer" id="timer">25:00</p>
        <div class="buttons">
            <button id="start">Start</button>
            <button id ="stop">Stop</button>
            <button id="reset">Reset</button>
        </div>
        
        <button id="mute">Mute Music</button>
        <audio id="music" src="music.mp3" loop></audio>
    </div>
<button id="fullscreen">Fullscreen ⛶</button>
<button id="darkmode">Dark Mode 🌙</button>

    <script src="script.js"></script>

</body>
</html>
